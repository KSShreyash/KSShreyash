<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Kumar Shreyash — a night sky of floating candles" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="55%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#141a2c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a9782a"/>
      <stop offset="35%" stop-color="#f0cf6b"/>
      <stop offset="60%" stop-color="#d3a625"/>
      <stop offset="100%" stop-color="#8c6318"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#ffb84d" stop-opacity=".55"/>
      <stop offset="60%" stop-color="#ff9d2e" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#ff9d2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flame">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="45%" stop-color="#ffc861"/>
      <stop offset="100%" stop-color="#ff8a1f" stop-opacity=".2"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>

    <g id="candle">
      <circle cx="0" cy="-4" r="34" fill="url(#halo)"/>
      <rect x="-4.5" y="0" width="9" height="46" rx="3" fill="#e8dcc0"/>
      <rect x="-4.5" y="0" width="3.2" height="46" rx="2" fill="#fffaf0" opacity=".55"/>
      <path d="M-4.5 12 q4 7 9 1 v6 q-5 6 -9 -1 z" fill="#d9caa6"/>
      <line x1="0" y1="-5" x2="0" y2="0" stroke="#4a4030" stroke-width="1.4"/>
      <ellipse cx="0" cy="-11" rx="4.6" ry="9" fill="url(#flame)">
        <animate attributeName="ry" values="9;11.5;8.2;10;9" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="rx" values="4.6;4;5;4.3;4.6" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="0;.7;-.6;.3;0" dur="2.3s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </defs>

  <style>
    .tw { animation: tw 3.4s ease-in-out infinite; }
    .tw:nth-of-type(even) { animation-duration: 4.6s; animation-delay: -1.4s; }
    @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:.9 } }
    .glow { animation: glow 4.5s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity:.22 } 50% { opacity:.5 } }
    .name { font-family: Georgia, 'Times New Roman', serif; }
    @media (prefers-reduced-motion: reduce) {
      .tw, .glow { animation: none; opacity:.5 }
    }
  </style>

  <rect width="1000" height="260" fill="url(#sky)"/>

  <!-- starfield -->
  <g fill="#dfe6ff">
    <circle class="tw" cx="70" cy="38" r="1.5"/><circle class="tw" cx="152" cy="92" r="1"/>
    <circle class="tw" cx="228" cy="30" r="1.3"/><circle class="tw" cx="311" cy="66" r="1"/>
    <circle class="tw" cx="392" cy="26" r="1.6"/><circle class="tw" cx="470" cy="84" r="1"/>
    <circle class="tw" cx="548" cy="34" r="1.2"/><circle class="tw" cx="629" cy="72" r="1.5"/>
    <circle class="tw" cx="704" cy="28" r="1"/><circle class="tw" cx="781" cy="88" r="1.4"/>
    <circle class="tw" cx="856" cy="40" r="1.1"/><circle class="tw" cx="934" cy="74" r="1.5"/>
    <circle class="tw" cx="112" cy="200" r="1"/><circle class="tw" cx="880" cy="196" r="1.2"/>
    <circle class="tw" cx="42" cy="132" r="1.1"/><circle class="tw" cx="962" cy="140" r="1"/>
  </g>

  <!-- floating candles -->
  <g transform="translate(88,46)"><g><use href="#candle"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="6s" repeatCount="indefinite"/></g></g>
  <g transform="translate(176,104)"><g><use href="#candle" transform="scale(.8)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 6; 0 0" dur="7.4s" repeatCount="indefinite"/></g></g>
  <g transform="translate(262,30)"><g><use href="#candle" transform="scale(.66)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="5.2s" repeatCount="indefinite"/></g></g>
  <g transform="translate(748,36)"><g><use href="#candle" transform="scale(.72)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 7; 0 0" dur="6.8s" repeatCount="indefinite"/></g></g>
  <g transform="translate(842,98)"><g><use href="#candle"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="5.9s" repeatCount="indefinite"/></g></g>
  <g transform="translate(922,32)"><g><use href="#candle" transform="scale(.62)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 5; 0 0" dur="8.1s" repeatCount="indefinite"/></g></g>

  <!-- title -->
  <ellipse class="glow" cx="500" cy="122" rx="230" ry="34" fill="#d3a625" filter="url(#soft)" opacity=".25"/>
  <text class="name" x="500" y="126" text-anchor="middle" font-size="52" letter-spacing="3"
        fill="url(#gold)">Kumar Shreyash</text>
  <text class="name" x="500" y="163" text-anchor="middle" font-size="16.5" letter-spacing="5.5"
        fill="#9fb0d0" font-style="italic">full-stack developer · applied AI · robotics</text>

  <!-- divider with a small star -->
  <g stroke="#d3a625" stroke-opacity=".45" stroke-width="1">
    <line x1="330" y1="186" x2="472" y2="186"/>
    <line x1="528" y1="186" x2="670" y2="186"/>
  </g>
  <path d="M500 178 l3.2 6.6 7.3 1 -5.3 5.1 1.3 7.2 -6.5-3.4 -6.5 3.4 1.3-7.2 -5.3-5.1 7.3-1 z" fill="#d3a625"/>

  <!-- wand with rising sparks -->
  <g transform="translate(500,226)">
    <line x1="-58" y1="14" x2="14" y2="-8" stroke="#5b4326" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-58" y1="14" x2="-36" y2="7" stroke="#3d2c19" stroke-width="6" stroke-linecap="round"/>
    <circle cx="18" cy="-9" r="3.4" fill="#fff3cf"/>
    <g fill="#f0cf6b">
      <circle cx="26" cy="-14" r="1.8"><animate attributeName="cy" values="-14;-42" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="34" cy="-12" r="1.4"><animate attributeName="cy" values="-12;-46" dur="3.4s" begin="-1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="3.4s" begin="-1.1s" repeatCount="indefinite"/></circle>
      <circle cx="14" cy="-16" r="1.2"><animate attributeName="cy" values="-16;-40" dur="3s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="3s" begin="-2s" repeatCount="indefinite"/></circle>
      <circle cx="42" cy="-10" r="1.6"><animate attributeName="cy" values="-10;-38" dur="2.9s" begin="-.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2.9s" begin="-.6s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>
